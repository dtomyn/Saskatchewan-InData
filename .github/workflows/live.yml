name: Refresh live readings

# Rebuilds the live stages (rivers, fires, air, alerts, outlooks, plus drinking-water advisories) about once an hour, rolls them
# into the daily record, and redeploys the site. Nothing is committed to main: public/data/now/ is not in git, and the
# daily record (public/data/history/) is appended to the data-history branch by the archive job. GitHub runs scheduled jobs late when it is
# busy, and turns schedules off in a repository with no activity for 60 days, so the app never assumes a reading is
# fresh: every live value shows its age.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Reach back as far as each feed keeps (run once, to start the daily record)
        type: boolean
        default: false

# Least privilege, as in deploy.yml: only the deploy job (which runs no repository code) can write to Pages or mint an
# OIDC token, and only the archive job (which runs no repository code either: git and the shell below) can push, and
# only to data-history. npm packages run during the build never hold either.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hist: ${{ steps.hist.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # the province outline and the place-name gazetteer the water stage reads change rarely: keep them between runs,
      # but start afresh each month (no restore-keys: an old cache restored would never be fetched again)
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/statcan
            .cache/cgndb
          key: live-reference-${{ steps.month.outputs.m }}
      - run: npm ci
      # A feed that is down keeps its last file: start from the files the site is serving now.
      - name: Restore the last live files
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p public/data/now
          for f in rivers fires air alerts outlooks aurora wind plume manifest; do
            curl -fsS --max-time 30 -o "public/data/now/$f.json" "$SITE/data/now/$f.json" || rm -f "public/data/now/$f.json"
          done
      # The daily record lives on the data-history branch (never on main). Read it into public/data/history/ so the site
      # ships it. If the branch exists, a failed checkout fails the run: starting the record afresh would overwrite it.
      - name: Is there a daily record yet?
        id: hist
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        # exit 2 is "no such branch"; anything else (network, auth) stops the run rather than starting the record afresh
        run: |
          rc=0; git ls-remote --exit-code --heads "$URL" data-history > /dev/null || rc=$?
          case $rc in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed ($rc): cannot tell whether the daily record exists"; exit 1 ;;
          esac
      - if: steps.hist.outputs.exists == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data-history
          path: .history-branch
          persist-credentials: false
      - name: Copy the daily record into the site
        run: |
          mkdir -p public/data/history
          if [ -d .history-branch ]; then cp -r .history-branch/. public/data/history/ && rm -rf public/data/history/.git; fi
      # a failed stage keeps its old file and records the error in the manifest; the run still deploys
      - run: npm run data now water ${{ inputs.backfill && 'history-backfill' || 'history' }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: history
          path: public/data/history
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3
  archive:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: history
          path: incoming
      # Additive only: files are added or replaced, never deleted (retention: keep everything).
      # Start a new branch only when the build found none; otherwise a failed fetch fails the job (and an orphan pushed
      # over a branch made meanwhile is refused as not a fast-forward).
      - name: Append to the data-history branch
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          HIST: ${{ needs.build.outputs.hist }}
        run: |
          git init -q record && cd record
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$URL"
          if [ "$HIST" = true ]; then git fetch -q --depth 1 origin data-history || exit 1; git checkout -q -b data-history FETCH_HEAD; else git checkout -q --orphan data-history; fi
          cp -r ../incoming/. .
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to keep."; exit 0; fi
          git commit -q -m "Daily record: run of $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data-history
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
