name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default; only the deploy job (which runs no repository code) can
# write to Pages or mint an OIDC token, so npm packages run during the build never hold either.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the live readings are not in git (public/data/now/): fetch them as live.yml does, so a push never deploys without them
      - name: Restore the last live files
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p public/data/now
          for f in rivers fires air alerts outlooks manifest; do
            curl -fsS --max-time 30 -o "public/data/now/$f.json" "$SITE/data/now/$f.json" || rm -f "public/data/now/$f.json"
          done
      # The daily record lives on the data-history branch (never on main). Read it into public/data/history/ so the site
      # ships it (only live.yml adds to it).
      - name: Is there a daily record yet?
        id: hist
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$URL" data-history > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.hist.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data-history
          path: .history-branch
          persist-credentials: false
      - name: Copy the daily record into the site
        run: |
          mkdir -p public/data/history
          if [ -d .history-branch ]; then cp -r .history-branch/. public/data/history/ && rm -rf public/data/history/.git; fi
      - run: npm run data now
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
