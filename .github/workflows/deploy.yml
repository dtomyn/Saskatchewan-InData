name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default; only the deploy job (which runs no repository code) can
# write to Pages or mint an OIDC token, so npm packages run during the build never hold either.
permissions: {}

# never cancel: a running live.yml in the same group would lose its archive job
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # the gazetteer the water stage reads, as live.yml keeps it
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/statcan
            .cache/cgndb
          key: live-reference-${{ steps.month.outputs.m }}
      - run: npm ci
      # the live readings are not in git (public/data/now/): fetch them as live.yml does, so a push never deploys without them
      - name: Restore the last live files
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p public/data/now
          for f in rivers fires air alerts outlooks aurora wind plume manifest; do
            curl -fsS --max-time 30 -o "public/data/now/$f.json" "$SITE/data/now/$f.json" || rm -f "public/data/now/$f.json"
          done
      # The daily record lives on the data-history branch (never on main). Read it into public/data/history/ so the site
      # ships it (only live.yml adds to it).
      - name: Is there a daily record yet?
        id: hist
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        # exit 2 is "no such branch"; anything else (network, auth) stops the run rather than starting the record afresh
        run: |
          rc=0; git ls-remote --exit-code --heads "$URL" data-history > /dev/null || rc=$?
          case $rc in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed ($rc): cannot tell whether the daily record exists"; exit 1 ;;
          esac
      - if: steps.hist.outputs.exists == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data-history
          path: .history-branch
          persist-credentials: false
      - name: Copy the daily record into the site
        run: |
          mkdir -p public/data/history
          if [ -d .history-branch ]; then cp -r .history-branch/. public/data/history/ && rm -rf public/data/history/.git; fi
      # water too, as live.yml does hourly: otherwise a push would deploy the committed advisories over newer ones
      - run: npm run data now water
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
