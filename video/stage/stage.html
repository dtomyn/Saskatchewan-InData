<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Living Skies Atlas · film stage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <!-- The film's stage: a 1920x1080 frame. The app runs in #app inside a floating window that the
         camera moves; the cursor, ripples and spotlight live in the window so they zoom with it, and
         titles, chips and cards live in #hud so they don't. Driven by video/render.py. -->
    <div id="bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <svg id="contours" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
    </div>
    <div id="win">
      <div class="bar">
        <i></i><i></i><i></i>
        <div class="url"><span class="lock"></span><span id="url-text">living-skies-atlas</span></div>
      </div>
      <iframe id="app" title="Living Skies Atlas"></iframe>
      <div id="marks"></div>
      <div id="spot"></div>
      <div id="cursor"><svg class="arrow" viewBox="0 0 28 28"><path d="M5 2.5v20.2l5.1-4.9 3.4 7.7 3.6-1.6-3.4-7.6h7.1z" /></svg><svg class="hand" viewBox="0 0 28 28"><path d="M10.2 3.2c-1.2 0-2 .9-2 2v10.3l-1.7-1.8c-.8-.8-2.1-.9-2.9-.1-.8.7-.8 2-.1 2.8l5.1 5.9c1.1 1.3 2.7 2 4.4 2h4.5c3 0 5.4-2.4 5.4-5.4v-5.6c0-1.1-.9-2-2-2-.4 0-.7.1-1 .3-.2-.9-1-1.6-2-1.6-.5 0-.9.2-1.3.5-.3-.8-1-1.3-1.9-1.3-.4 0-.7.1-1 .3V5.2c0-1.1-.8-2-2-2z" /></svg></div>
    </div>
    <div id="fade"></div>
    <div id="hud"></div>
    <script src="stage.js"></script>
  </body>
</html>
